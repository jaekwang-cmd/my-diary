<body>

<!-- ===== 잠금 화면 ===== -->
<div id="lockScreen" class="lock-screen hidden">
  <div class="lock-inner">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" width="44" height="44"><path d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V11a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/></svg>
    </div>
    <p class="lock-title">패스코드를 입력</p>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <p class="lock-hint" id="lockHint"></p>
    <div class="keypad" id="keypad">
      <button data-k="1"><b>1</b></button>
      <button data-k="2"><b>2</b><s>ABC</s></button>
      <button data-k="3"><b>3</b><s>DEF</s></button>
      <button data-k="4"><b>4</b><s>GHI</s></button>
      <button data-k="5"><b>5</b><s>JKL</s></button>
      <button data-k="6"><b>6</b><s>MNO</s></button>
      <button data-k="7"><b>7</b><s>PQRS</s></button>
      <button data-k="8"><b>8</b><s>TUV</s></button>
      <button data-k="9"><b>9</b><s>WXYZ</s></button>
      <button data-k="bio" id="bioBtn" class="ghost" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 2a9 9 0 0 0-9 9c0 1 .2 2 .5 2.9a1 1 0 0 0 1.9-.6A7 7 0 0 1 12 4a7 7 0 0 1 6.6 9.3 1 1 0 0 0 1.9.6A9 9 0 0 0 12 2zm0 3a6 6 0 0 0-6 6c0 2.3-.4 4.3-1.2 5.9a1 1 0 1 0 1.8.9A16 16 0 0 0 8 11a4 4 0 1 1 8 0c0 2.6-.4 5-1.2 7.2a1 1 0 0 0 1.9.7A24 24 0 0 0 18 11a6 6 0 0 0-6-6zm0 3a3 3 0 0 0-3 3c0 3-.6 5.8-1.7 8.3a1 1 0 0 0 1.8.8A24 24 0 0 0 11 11a1 1 0 1 1 2 0c0 3.4-.5 6.6-1.4 9.4a1 1 0 0 0 1.9.6A33 33 0 0 0 15 11a3 3 0 0 0-3-3z"/></svg>
      </button>
      <button data-k="0"><b>0</b></button>
      <button data-k="del" class="ghost">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 4a2 2 0 0 0-1.5.7l-5 6a2 2 0 0 0 0 2.6l5 6A2 2 0 0 0 9 20h11a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H9zm3.3 4.3L14.6 10l2.3-2.3 1.4 1.4L16 11.4l2.3 2.3-1.4 1.4L14.6 13l-2.3 2.3-1.4-1.4L13.2 12 11 9.7l1.4-1.4z"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ===== 앱 ===== -->
<div id="app" class="app">

  <!-- 리스트 뷰 -->
  <section class="view" id="view-list">
    <header class="topbar">
      <button class="ic" id="btnJumpCal" aria-label="달력">
        <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zM5 9h14v10H5V9z"/></svg>
      </button>
      <h1>일기</h1>
      <button class="ic" id="btnSearch" aria-label="검색">
        <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.3l5 5 1.4-1.4-5-5A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
      </button>
    </header>
    <div class="scroll" id="listScroll">
      <div id="listBody"></div>
      <div class="empty" id="listEmpty">일기는 아직 없습니다.</div>
    </div>
  </section>

  <!-- 달력 뷰 -->
  <section class="view hidden" id="view-cal">
    <header class="topbar cal-head">
      <button class="ic" id="calPrev"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
      <button class="mon-pill" id="calTitle">2026년 7월</button>
      <button class="ic" id="calNext"><svg viewBox="0 0 24 24"><path d="m8.6 5.4 1.4-1.4 8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></button>
      <button class="txtbtn" id="calToday">오늘</button>
    </header>
    <div class="scroll">
      <div class="cal-grid" id="calGrid"></div>
      <div class="daybar" id="calDayBar"></div>
      <div id="calDayList"></div>
      <div class="empty small" id="calEmpty">해당 날짜의 일기는 아직 없습니다.</div>
    </div>
  </section>

  <!-- 통계 뷰 -->
  <section class="view hidden" id="view-stat">
    <header class="topbar">
      <button class="ic" id="statPrev"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
      <button class="mon-pill" id="statTitle">2026년 7월</button>
      <button class="ic" id="statNext"><svg viewBox="0 0 24 24"><path d="m8.6 5.4 1.4-1.4 8 8-8 8-1.4-1.4 6.6-6.6z"/></svg></button>
      <button class="ic" id="statCfg" aria-label="표시 설정">
        <svg viewBox="0 0 24 24"><path d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
      </button>
    </header>
    <div class="scroll" id="statScroll">
      <div id="statSummary"></div>
      <div id="statCounts"></div>
      <div id="statHeatmap"></div>
      <div id="statDday"></div>
      <div class="sec-label">관리</div>
      <div class="card">
        <button class="row" id="rowManageRoutine"><span class="ri">🏷️</span><span class="rt">루틴 카탈로그 편집</span><span class="rv" id="vRoutineCount"></span><span class="rc"></span></button>
        <button class="row" id="rowManageDday"><span class="ri">📆</span><span class="rt">D-DAY 편집</span><span class="rv" id="vDdayCount"></span><span class="rc"></span></button>
        <button class="row" id="rowStatCfg"><span class="ri">👁️</span><span class="rt">통계 표시 항목</span><span class="rc"></span></button>
      </div>
      <div style="height:20px"></div>
    </div>
  </section>

  <!-- 설정 뷰 -->
  <section class="view hidden" id="view-set">
    <header class="topbar"><h1>설정</h1></header>
    <div class="scroll" id="setScroll">

      <div class="sec-label">디자인</div>
      <div class="card">
        <button class="row" id="rowTheme">
          <span class="ri">🎨</span><span class="rt">테마 컬러 변경</span><span class="rv" id="vTheme">심플 블루</span><span class="rc"></span>
        </button>
        <button class="row" id="rowAppearance">
          <span class="ri">🌗</span><span class="rt">화면 모드</span><span class="rv" id="vAppearance">시스템</span><span class="rc"></span>
        </button>
        <button class="row" id="rowFont">
          <span class="ri">🔠</span><span class="rt">문자 설정</span><span class="rv" id="vFont">보통</span><span class="rc"></span>
        </button>
      </div>

      <div class="sec-label">설정</div>
      <div class="card">
        <button class="row" id="rowLines">
          <span class="ri">📄</span><span class="rt">리스트의 행수</span><span class="rv" id="vLines">4</span><span class="rc"></span>
        </button>
        <button class="row" id="rowWeekStart">
          <span class="ri">📅</span><span class="rt">달력의 시작 요일</span><span class="rv" id="vWeekStart">일요일</span><span class="rc"></span>
        </button>
        <div class="row static">
          <span class="ri">🔔</span><span class="rt">입력누락방지 알림 통지</span>
          <label class="sw"><input type="checkbox" id="swNotify"><i></i></label>
        </div>
        <button class="row sub" id="rowNotifyTime" hidden>
          <span class="ri"></span><span class="rt">알림 시각</span><span class="rv" id="vNotifyTime">21:00</span><span class="rc"></span>
        </button>
        <div class="row static">
          <span class="ri">🔒</span><span class="rt">패스코드 잠금</span>
          <label class="sw"><input type="checkbox" id="swLock"><i></i></label>
        </div>
        <div class="row static" id="rowBio" hidden>
          <span class="ri">🫆</span><span class="rt">생체 인증 사용</span>
          <label class="sw"><input type="checkbox" id="swBio"><i></i></label>
        </div>
      </div>

      <div class="sec-label">구글 드라이브</div>
      <div class="card">
        <div class="row static">
          <span class="ri">☁️</span><span class="rt">계정 연결</span>
          <span class="rv" id="vDriveUser">연결 안 됨</span>
        </div>
        <button class="row" id="rowDriveAuth"><span class="ri"></span><span class="rt accent" id="tDriveAuth">구글 계정 연결하기</span></button>
        <button class="row" id="rowBackup"><span class="ri">⬆️</span><span class="rt">지금 백업하기</span><span class="rv" id="vLastSync">한 적 없음</span><span class="rc"></span></button>
        <button class="row" id="rowRestore"><span class="ri">⬇️</span><span class="rt">드라이브에서 복원</span><span class="rc"></span></button>
        <div class="row static">
          <span class="ri">🔄</span><span class="rt">자동 백업</span>
          <label class="sw"><input type="checkbox" id="swAutoSync"><i></i></label>
        </div>
      </div>
      <p class="note" id="driveNote"></p>

      <div class="sec-label">데이터</div>
      <div class="card">
        <button class="row" id="rowExport"><span class="ri">💾</span><span class="rt">데이터 내보내기 (zip)</span><span class="rc"></span></button>
        <button class="row" id="rowImport"><span class="ri">📂</span><span class="rt">백업 파일에서 가져오기</span><span class="rc"></span></button>
        <button class="row" id="rowWipe"><span class="ri">🗑️</span><span class="rt danger">모든 데이터를 삭제하기</span></button>
      </div>

      <div class="sec-label">앱 관련</div>
      <div class="card">
        <button class="row" id="rowAbout"><span class="ri">ℹ️</span><span class="rt">앱 정보</span><span class="rc"></span></button>
        <div class="row static"><span class="ri">📊</span><span class="rt">저장된 일기</span><span class="rv" id="vCount">0건</span></div>
        <div class="row static"><span class="ri">🖼️</span><span class="rt">사진 사용량</span><span class="rv" id="vStorage">-</span></div>
        <div class="row static"><span class="ri">🛡️</span><span class="rt">저장소 보호</span><span class="rv" id="vPersist">-</span></div>
      </div>
      <p class="note" id="iosNote" hidden></p>
      <p class="ver">심플 일기장 · PWA version 1.1.0</p>
    </div>
  </section>

  <!-- 하단 탭 -->
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="list">
      <svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5zm4 .5h14v1.5H7V5.5zM3 11h2v2H3v-2zm4 .5h14V13H7v-1.5zM3 17h2v2H3v-2zm4 .5h14V19H7v-1.5z"/></svg>
      <span>리스트</span>
    </button>
    <button class="tab" data-tab="cal">
      <svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zM5 9h14v10H5V9zm2 2v2h2v-2H7zm4 0v2h2v-2h-2zm4 0v2h2v-2h-2z"/></svg>
      <span>달력</span>
    </button>
    <button class="tab" data-tab="stat">
      <svg viewBox="0 0 24 24"><path d="M4 20h3v-7H4v7zm6.5 0h3V4h-3v16zm6.5 0h3v-11h-3v11z"/></svg>
      <span>통계</span>
    </button>
    <button class="tab" data-tab="set">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/><path d="m19.4 13-.1-1 .1-1 2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3H9.9l-.4 2.6c-.6.3-1.2.6-1.7 1l-2.4-1-2 3.5 2 1.5v2l-2 1.5 2 3.4 2.4-1c.5.4 1.1.8 1.7 1l.4 2.5h5.1l.4-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2-1.5z" opacity=".55"/></svg>
      <span>설정</span>
    </button>
  </nav>

  <!-- 아이폰 Safari 로 열었는데 아직 설치 안 했을 때만 뜸 -->
  <div class="ios-banner hidden" id="iosBanner">
    <img src="./icons/icon-192.png" alt="">
    <div class="ib-txt">
      <b>홈 화면에 추가해서 쓰세요</b>
      <span>앱처럼 전체화면으로 열리고 알림도 켜집니다</span>
    </div>
    <button class="ib-go" id="iosHow">방법</button>
    <button class="ib-x" id="iosClose" aria-label="닫기">✕</button>
  </div>

  <button class="fab" id="fab" aria-label="일기 쓰기">
    <svg viewBox="0 0 24 24"><path d="M20.7 5.6 18.4 3.3a1 1 0 0 0-1.4 0l-1.9 1.9 3.7 3.7 1.9-1.9a1 1 0 0 0 0-1.4zM13.7 6.6 3 17.3V21h3.7L17.4 10.3l-3.7-3.7z"/></svg>
  </button>
</div>

<!-- ===== 에디터 ===== -->
<section class="page hidden" id="page-edit">
  <header class="topbar">
    <button class="ic" id="edBack"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg></button>
    <button class="dt-btn" id="edDate">2026년 7월 27일 (월) 9:47</button>
    <button class="ic" id="edPhoto"><svg viewBox="0 0 24 24"><path d="M21 5H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM4 17l4.5-5.5 3 3.5L15 10l5 7H4z"/><circle cx="8" cy="9" r="1.6"/></svg></button>
    <button class="txtbtn strong" id="edSave">저장</button>
  </header>
  <div class="scroll edit-scroll">
    <input id="edTitle" class="ed-title" placeholder="제목" maxlength="120">
    <div class="chiprow" id="edRoutines"></div>
    <textarea id="edBody" class="ed-body" placeholder="오늘은 어떤 하루였나요?"></textarea>
    <div class="photo-strip" id="edPhotos"></div>
  </div>
  <input type="file" id="filePick" accept="image/*" multiple hidden>
</section>

<!-- ===== 상세 보기 ===== -->
